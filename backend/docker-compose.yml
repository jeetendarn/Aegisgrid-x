services:
  backend:
    build: .
    container_name: aegisgrid-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres

  frontend:
    build:
      context: ../frontend
    container_name: aegisgrid-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  postgres:
    image: postgres:18
    container_name: aegisgrid-postgres

    environment:
      POSTGRES_DB: aegisgrid
      POSTGRES_USER: aegisgrid
      POSTGRES_PASSWORD: aegisgrid

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
