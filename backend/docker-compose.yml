services:
  backend:
    build: .

    container_name: aegisgrid-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres

  postgres:
    image: postgres:18

    container_name: aegisgrid-postgres

    environment:
      POSTGRES_DB: aegisgrid
      POSTGRES_USER: aegisgrid
      POSTGRES_PASSWORD: aegisgrid

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: